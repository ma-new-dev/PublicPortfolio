name: Diagnose

# Temporary: inspects what the built app declares to iOS (device families,
# orientations, scene config) and which Yahoo market-cap endpoints answer.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for device (unsigned) and dump Info.plist
        run: |
          set -o pipefail
          xcodebuild -project IndianPortfolio.xcodeproj -scheme IndianPortfolio \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -50 build.log; exit 1; }
          APP=$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP"
          plutil -p "$APP/Info.plist"
          echo "--- effective build settings ---"
          xcodebuild -project IndianPortfolio.xcodeproj -target IndianPortfolio -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E " (TARGETED_DEVICE_FAMILY|SUPPORTED_PLATFORMS|SDKROOT|IPHONEOS_DEPLOYMENT_TARGET|SUPPORTS_MACCATALYST|SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD|SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD|INFOPLIST_KEY_UIRequiresFullScreen|INFOPLIST_KEY_UISupportedInterfaceOrientations.*) ="

      - name: Probe Yahoo market-cap sources
        run: |
          UA_BROWSER='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          S=PAYTM.NS
          probe() { echo "== $1"; curl -s -o /tmp/out -w "HTTP %{http_code}\n" -A "$2" ${3:+-b /tmp/jar -c /tmp/jar} "$4"; head -c 400 /tmp/out; echo; }
          probe "v7 quote, no crumb, UA=Mozilla/5.0" "Mozilla/5.0" "" "https://query1.finance.yahoo.com/v7/finance/quote?symbols=$S&fields=marketCap"
          probe "chart 1d/1m meta" "Mozilla/5.0" "" "https://query1.finance.yahoo.com/v8/finance/chart/$S?range=1d&interval=1m"
          echo "== crumb flow (browser UA, cookie jar)"
          curl -s -o /dev/null -w "fc.yahoo.com HTTP %{http_code}\n" -A "$UA_BROWSER" -c /tmp/jar -b /tmp/jar https://fc.yahoo.com
          CRUMB=$(curl -s -A "$UA_BROWSER" -c /tmp/jar -b /tmp/jar https://query2.finance.yahoo.com/v1/test/getcrumb)
          echo "crumb length: ${#CRUMB} (starts: ${CRUMB:0:3})"
          probe "v7 quote WITH crumb" "$UA_BROWSER" jar "https://query2.finance.yahoo.com/v7/finance/quote?symbols=$S&fields=marketCap&crumb=$CRUMB"
          probe "v10 quoteSummary price WITH crumb" "$UA_BROWSER" jar "https://query2.finance.yahoo.com/v10/finance/quoteSummary/$S?modules=price&crumb=$CRUMB"
          echo "== crumb flow with default (non-browser) UA"
          rm -f /tmp/jar
          curl -s -o /dev/null -w "fc.yahoo.com HTTP %{http_code}\n" -c /tmp/jar -b /tmp/jar https://fc.yahoo.com
          curl -s -w "\ngetcrumb HTTP %{http_code}\n" -c /tmp/jar -b /tmp/jar https://query2.finance.yahoo.com/v1/test/getcrumb | tail -c 200
          probe "timeseries shares outstanding, no crumb" "$UA_BROWSER" "" "https://query1.finance.yahoo.com/ws/fundamentals-timeseries/v1/finance/timeseries/$S?type=annualOrdinarySharesNumber,quarterlyOrdinarySharesNumber&period1=1600000000&period2=1900000000"
          probe "timeseries marketCap (trailingMarketCap), no crumb" "$UA_BROWSER" "" "https://query1.finance.yahoo.com/ws/fundamentals-timeseries/v1/finance/timeseries/$S?type=trailingMarketCap&period1=1700000000&period2=1900000000"
