name: iOS Build

# Compile-check the app + widget on every push / PR (no signing, no secrets).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$newest" ] && sudo xcode-select -s "$newest"
          xcodebuild -version
          ver="$(xcodebuild -version | awk '/^Xcode/{print $2}')"
          # iPhone Duo shows apps built with an SDK older than Xcode 27.1 in
          # compatibility mode (a phone-sized window) on its inner display.
          if [ "$(printf '%s\n27.1\n' "$ver" | sort -V | head -1)" != "27.1" ]; then
            echo "::warning::Building with Xcode $ver. iPhone Duo needs Xcode 27.1+ for full-screen on the inner display; this build will run in compatibility mode there. Archive from a Mac with Xcode 27.1+ for Duo, or wait for GitHub's runner image to add it."
          fi

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project IndianPortfolio.xcodeproj \
            -scheme IndianPortfolio \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning: .*(deprecated|Sendable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
